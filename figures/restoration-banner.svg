<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Awesome All-in-One Image Restoration</title>
  <desc id="desc">A research guide to image restoration. Stylized noisy, rainy and blurred image cards converge toward a clear landscape, illustrating a shared restoration goal.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#152237"/><stop offset="1" stop-color="#0a1423"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#38649d" stop-opacity=".3"/><stop offset="1" stop-color="#0a1423" stop-opacity="0"/></radialGradient>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#23486c"/><stop offset="1" stop-color="#101e32"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#91b9e3" stroke-opacity=".05"/></pattern>
    <pattern id="noise" width="21" height="19" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="1" fill="#dbeafe" opacity=".6"/><circle cx="14" cy="12" r="1.4" fill="#102037" opacity=".9"/><circle cx="9" cy="17" r=".7" fill="#dbeafe" opacity=".45"/></pattern>
    <pattern id="rain" width="25" height="27" patternUnits="userSpaceOnUse"><path d="M16 1l-7 14M27 19l-4 8" stroke="#c1dbf3" stroke-opacity=".45"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="1.5"/></filter>
    <clipPath id="input"><rect width="142" height="90" rx="9"/></clipPath>
    <clipPath id="output"><rect x="1090" y="122" width="142" height="172" rx="12"/></clipPath>
    <g id="landscape">
      <rect width="142" height="90" fill="url(#sky)"/>
      <circle cx="110" cy="24" r="11" fill="#ffcda8"/>
      <path d="M0 70l39-44 40 36 26-27 37 35v20H0z" fill="#446e91"/>
      <path d="M0 82l37-31 44 23 26-17 35 25v8H0z" fill="#82b5c8"/>
      <path d="M0 82h142v8H0z" fill="#172d44"/>
    </g>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#background)"/>
  <rect x="730" y="1" width="549" height="418" rx="20" fill="url(#grid)"/>
  <ellipse cx="1040" cy="210" rx="300" ry="245" fill="url(#halo)"/>
  <rect x="1" y="1" width="1278" height="418" rx="19" fill="none" stroke="#314055"/>
  <path d="M64 65h28" stroke="#ffbe98" stroke-width="3"/>
  <text x="105" y="71" fill="#a8bacd" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">AWESOME / LOW-LEVEL VISION</text>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="-2">
    <text x="60" y="163" fill="#f2f7fc" font-size="72">All-in-One</text>
    <text x="60" y="237" fill="#ffbe98" font-size="64">Image Restoration</text>
  </g>
  <text x="64" y="286" fill="#b7c6d7" font-family="Arial, Helvetica, sans-serif" font-size="21">Many degradations. A shared restoration goal.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.7">
    <rect x="64" y="336" width="107" height="33" rx="16.5" fill="#ffbe98" fill-opacity=".09" stroke="#ffbe98" stroke-opacity=".35"/>
    <text x="84" y="357" fill="#ffcfb2">PAPERS</text>
    <rect x="183" y="336" width="85" height="33" rx="16.5" fill="#9cc7f9" fill-opacity=".06" stroke="#9cc7f9" stroke-opacity=".28"/>
    <text x="202" y="357" fill="#b5d8ff">CODE</text>
    <rect x="280" y="336" width="151" height="33" rx="16.5" fill="#9cc7f9" fill-opacity=".04" stroke="#9cc7f9" stroke-opacity=".2"/>
    <text x="297" y="357" fill="#b5cbe1">BENCHMARKS</text>
  </g>
  <text x="790" y="64" fill="#94abc5" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">A SHARED RESTORATION GOAL</text>
  <g fill="none" stroke="#84b6eb" stroke-width="1.5" stroke-opacity=".55">
    <path d="M932 135h34q17 0 17 17v31q0 21 21 21"/>
    <path d="M952 204h52"/>
    <path d="M974 267h6q17 0 17-17v-25q0-21 13-21"/>
    <path d="M1048 204h42" stroke="#ffbe98" stroke-width="2"/>
    <path d="M1083 198l7 6-7 6" stroke="#ffbe98" stroke-width="2"/>
  </g>
  <g transform="translate(790 92)">
    <g clip-path="url(#input)"><use href="#landscape" opacity=".64"/><rect width="142" height="90" fill="url(#noise)"/></g>
    <rect width="142" height="90" rx="9" fill="none" stroke="#6b8ba8"/>
    <rect x="9" y="8" width="48" height="17" rx="4" fill="#0e1a2b"/>
    <text x="17" y="20" fill="#c8d5e4" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1">NOISE</text>
  </g>
  <g transform="translate(810 159)">
    <g clip-path="url(#input)"><use href="#landscape" opacity=".68"/><rect width="142" height="90" fill="url(#rain)"/></g>
    <rect width="142" height="90" rx="9" fill="none" stroke="#6b8ba8"/>
    <rect x="9" y="8" width="43" height="17" rx="4" fill="#0e1a2b"/>
    <text x="17" y="20" fill="#c8d5e4" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1">RAIN</text>
  </g>
  <g transform="translate(832 226)">
    <g clip-path="url(#input)"><use href="#landscape" opacity=".65" filter="url(#soft)"/></g>
    <rect width="142" height="90" rx="9" fill="none" stroke="#6b8ba8"/>
    <rect x="9" y="8" width="43" height="17" rx="4" fill="#0e1a2b"/>
    <text x="17" y="20" fill="#c8d5e4" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1">BLUR</text>
  </g>
  <rect x="1004" y="182" width="44" height="44" rx="11" fill="#182a41" stroke="#a9cef4" stroke-opacity=".7"/>
  <g fill="#b5d8ff"><rect x="1015" y="193" width="8" height="8" rx="2"/><rect x="1029" y="193" width="8" height="8" rx="2"/><rect x="1015" y="207" width="8" height="8" rx="2"/><rect x="1029" y="207" width="8" height="8" rx="2" fill="#ffbe98"/></g>
  <g clip-path="url(#output)">
    <rect x="1090" y="122" width="142" height="172" fill="url(#sky)"/>
    <circle cx="1193" cy="161" r="17" fill="#ffcfaa"/>
    <path d="M1090 249l49-76 47 59 23-30 40 49v43h-159z" fill="#587fa7"/>
    <path d="M1090 266l51-60 48 50 26-23 30 43v18h-155z" fill="#96c2d1"/>
    <path d="M1090 272h142v22h-142z" fill="#18364e"/>
    <path d="M1104 280h64m18 6h31m-54-12h32" stroke="#91bfd2" stroke-opacity=".5"/>
  </g>
  <rect x="1090" y="122" width="142" height="172" rx="12" fill="none" stroke="#ffbe98" stroke-opacity=".8"/>
  <text x="1107" y="317" fill="#ffcfb2" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">RESTORED</text>
  <path d="M790 357h442" stroke="#314055"/>
  <text x="790" y="383" fill="#8097b1" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.3">CONCEPTUAL RESTORATION ILLUSTRATION</text>
</svg>
